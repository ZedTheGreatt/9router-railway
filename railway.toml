# Only [build], [deploy] and [environments] are read by Railway.
# Variables and the /app/data volume are defined in the template composer,
# not here — see README.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

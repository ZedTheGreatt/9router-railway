[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[variables]
PORT = "20128"
DATA_DIR = "/app/data"
BASE_URL = "https://${{RAILWAY_PUBLIC_DOMAIN}}"
AUTH_COOKIE_SECURE = "true"
REQUIRE_API_KEY = "true"
ENABLE_REQUEST_LOGS = "false"

[[volumes]]
mountPath = "/app/data"
